<div class="popup">
    <button class="close-btn" type="button" (click)="trigger_close()" aria-label="Close project overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
        </svg>
    </button>

    <div class="popup-content">
        <section class="picture-section">
            <img class="selected-picture" src="{{current_picture}}" alt="Selected picture of {{project.name}}">

            <div class="pictures-overview">
                @for (project_picture of project.overview_pictures; track project_picture; let i = $index) {
                <button class="thumb" type="button" [class.thumb--active]="i === current_picture_index"
                    [attr.aria-pressed]="i === current_picture_index" (click)="current_picture_index = i">
                    <img class="thumb-img" src="{{project_picture}}" alt="{{project.name}} picture {{i + 1}}">
                </button>
                }
            </div>
        </section>

        <section class="description-section">
            <h2 class="project-title">{{project.name}}</h2>

            <dl class="meta">
                <div class="meta-row">
                    <dt>Category</dt>
                    <dd>{{project.category}}</dd>
                </div>
                <div class="meta-row">
                    <dt>Type</dt>
                    <dd>{{project.type}}</dd>
                </div>
            </dl>

            <div class="technologies">
                <h3 class="section-label">Technologies</h3>
                <div class="technologies-list">
                    @for (project_technologie of project.technologies; track project_technologie.id) {
                    <span class="technology-ico" [innerHTML]="sanitizeSvg(project_technologie.picture)"></span>
                    }
                </div>
            </div>

            <!-- remplace par le champ de description de ton modèle : {{project.description}} -->
            <div class="description">
                <h3 class="section-label">Description</h3>
                <p class="project-description">
                </p>
            </div>

            <div class="button-section">
                <button class="learn-more-btn" type="button">Learn more</button>
            </div>
        </section>
    </div>
</div>
