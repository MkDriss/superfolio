<div>
    <img src="{{project.main_picture}}" alt="">
    <div>
        <h2 class="project-title">{{project.name}}</h2>

        <div class="meta">
            @if (project.mention && project.mention.content !== "") {
            <div class="meta-row">
                <dt>Mention</dt>
                <dd>{{project.mention.content}}</dd>
            </div>
            }
            <div class="meta-row">
                <dt>Category</dt>
                <dd>{{project.category}}</dd>
            </div>
            <div class="meta-row">
                <dt>Type</dt>
                <dd>{{project.type}}</dd>
            </div>
        </div>

        <h3 class="section-label">Technologies</h3>
        <div class="technologies-list">
            @for (project_technologie of project.technologies; track project_technologie.id) {
            <span class="technology-ico" role="img" tabindex="0" [attr.data-name]="project_technologie.name"
                [attr.aria-label]="project_technologie.name"
                [innerHTML]="sanitizeSvg(project_technologie.picture)"></span>
            }
        </div>
    </div>
</div>
