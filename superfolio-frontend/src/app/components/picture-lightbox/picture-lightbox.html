<div class="lightbox" role="dialog" aria-modal="true" [attr.aria-label]="picture.alt"
    (click)="on_backdrop_click($event)">

    <button class="close-btn" type="button" (click)="close.emit()" aria-label="Close picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
        </svg>
    </button>

    <img class="lightbox-img" [src]="picture.src" [alt]="picture.alt">
</div>
