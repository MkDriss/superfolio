<div class="home-container">
    <div class="first-page">
        <h1>Welcome on my space</h1>
    </div>

    <section class="search-section">
        <input type="text" placeholder="Rechercer un projet" class="search-input">
        <select class="category-selector" name="" id="">
            <option [value]=-1>-- Selectionner une technologie --</option>
            @for (technology of technologies; track technology.id) {
            <option [value]="technology.id">{{technology.name}}</option>
            }
        </select>
    </section>

    <section class="project-section">
        <div class="projects-container">
            @for (project of projects; track project.id){
            <app-project-card [project]="project" (click)="open_project_pop_up(project.id)"></app-project-card>
            }
        </div>
    </section>
</div>

@if(show_project_pop_up){
<div class="backdrop" animate.enter="fade-in" animate.leave="fade-out" (click)="close_project_pop_up()">
    <div class="popup-wrapper" animate.enter="slide-in" animate.leave="slide-out" (click)="$event.stopPropagation()">
        <app-project-pop-up [project]="selected_project!"></app-project-pop-up>
    </div>
</div>
}
