server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # compression : les bundles Angular sont volumineux
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # fichiers statiques versionnés (hash dans le nom) : cache long
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # routeur Angular : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}