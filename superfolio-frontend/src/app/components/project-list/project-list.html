<section class="my-project-container">
    <img class="hero-bg" src="projects-list-background.jpg" alt="">

    <div class="my-project-list-content">
        <h2 class="title">My projects</h2>

        <div class="search-section">
            <input type="search" class="search-input" placeholder="Search a project" aria-label="Search a project">
            <select class="category-selector" aria-label="Filter by technology">
                <option [value]="-1">All technologies</option>
                @for (technology of technologies; track technology.id) {
                <option [value]="technology.id">{{technology.name}}</option>
                }
            </select>
        </div>

        <div class="project-section">
            <div class="projects-container">
                @for (project of projects; track project.id) {
                <app-project-card [project]="project" (click)="open_project_pop_up(project.id)"></app-project-card>
                }
            </div>
        </div>
    </div>

    <div class="next-btn-container">
        <button class="button" (click)="next.emit()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M12 3C12.5523 3 13 3.44772 13 4V17.5858L18.2929 12.2929C18.6834 11.9024 19.3166 11.9024 19.7071 12.2929C20.0976 12.6834 20.0976 13.3166 19.7071 13.7071L12.7071 20.7071C12.3166 21.0976 11.6834 21.0976 11.2929 20.7071L4.29289 13.7071C3.90237 13.3166 3.90237 12.6834 4.29289 12.2929C4.68342 11.9024 5.31658 11.9024 5.70711 12.2929L11 17.5858V4C11 3.44772 11.4477 3 12 3Z"
                    fill="currentColor"></path>
            </svg>
            Contact me
        </button>
    </div>
</section>

@if (show_project_pop_up) {
<div class="backdrop" animate.enter="fade-in" animate.leave="fade-out" (click)="on_backdrop_click($event)">
    <div class="popup-wrapper" animate.enter="slide-in" animate.leave="slide-out">
        <app-project-pop-up [project]="selected_project!" (close)="close_project_pop_up()"></app-project-pop-up>
    </div>
</div>
}
